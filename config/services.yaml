parameters:
    uploadsDir: '%kernel.project_dir%/public/images/avatars'
    banners_directory: '%kernel.project_dir%/public/images/banners'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $uploadsDir: '%uploadsDir%'
            $banners_directory: '%banners_directory%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Service\GeocodingService:
        arguments:
            $httpClient: '@http_client'
